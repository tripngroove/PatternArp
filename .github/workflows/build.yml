name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CLAP_VALIDATOR_REV: b2f1d9b
  ARTEFACTS: build/plugin/PatternArp_artefacts/Release
  AU_ARTEFACTS: build/plugin/PatternArpMidiFX_artefacts/Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            generator: -G Ninja
          - name: Windows
            os: windows-2022
            generator: ""
          - name: Linux
            os: ubuntu-24.04
            generator: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libegl-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Tests
        shell: bash
        run: |
          # The plugin test opens the editor, which needs a display on Linux.
          wrap=()
          if [ "$RUNNER_OS" = "Linux" ]; then wrap=(xvfb-run -a); fi
          "${wrap[@]}" ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      # --- Validation -------------------------------------------------------------------

      - name: Cache clap-validator
        id: clap-validator-cache
        uses: actions/cache@v4
        with:
          path: tools/clap-validator
          key: clap-validator-${{ runner.os }}-${{ env.CLAP_VALIDATOR_REV }}

      - name: Build clap-validator
        if: steps.clap-validator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --git https://github.com/free-audio/clap-validator --rev "$CLAP_VALIDATOR_REV" --locked --root tools/clap-validator

      - name: Validate CLAP
        shell: bash
        run: tools/clap-validator/bin/clap-validator validate --only-failed "$ARTEFACTS/CLAP/PatternArp.clap"

      - name: Download pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   zip=pluginval_macOS.zip;   bin=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) zip=pluginval_Windows.zip; bin=pluginval.exe ;;
            Linux)   zip=pluginval_Linux.zip;   bin=pluginval ;;
          esac
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$zip"
          unzip -q pluginval.zip -d tools/pluginval
          echo "PLUGINVAL=tools/pluginval/$bin" >> "$GITHUB_ENV"

      - name: Validate VST3
        shell: bash
        run: |
          args=(--strictness-level 10 --validate-in-process --validate "$ARTEFACTS/VST3/PatternArp.vst3")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$PLUGINVAL" --skip-gui-tests "${args[@]}"
          else
            "$PLUGINVAL" "${args[@]}"
          fi

      - name: Validate AU MIDI FX
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU_ARTEFACTS/AU/PatternArp MIDI FX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumi Patm Trpg

      # --- Downloadable plugins ----------------------------------------------------------

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "$ARTEFACTS/VST3/PatternArp.vst3" "$ARTEFACTS/CLAP/PatternArp.clap" dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$AU_ARTEFACTS/AU/PatternArp MIDI FX.component" dist/
          fi

      - name: Zip (macOS keeps bundle permissions and signatures)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist "PatternArp-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PatternArp-${{ matrix.name }}
          path: ${{ runner.os == 'macOS' && format('PatternArp-{0}.zip', matrix.name) || 'dist' }}
